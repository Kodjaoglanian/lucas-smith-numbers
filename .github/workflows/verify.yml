name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify published factorizations
        run: python verify.py
